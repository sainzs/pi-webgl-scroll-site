name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SKILL.md frontmatter has name + description
        run: |
          pip install pyyaml
          python - <<'EOF'
          import yaml, sys
          text = open("SKILL.md").read()
          assert text.startswith("---\n"), "SKILL.md missing YAML frontmatter"
          fm = yaml.safe_load(text.split("---\n", 2)[1])
          for key in ("name", "description"):
              assert fm.get(key), f"SKILL.md frontmatter missing '{key}'"
          print("frontmatter OK:", fm["name"])
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Pillow
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
      - name: Scaffold a fresh site from the skill
        run: bash scripts/scaffold.sh /tmp/skilltest
      - name: Build
        run: npm run build
        working-directory: /tmp/skilltest
      - name: Preview, capture 6 frames, numeric QA
        working-directory: /tmp/skilltest
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          python capture.py http://localhost:4173/ shots 6
          python check_frames.py shots
        env:
          PYTHONUNBUFFERED: "1"
